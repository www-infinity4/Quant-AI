name = "quant-ai"
main = "worker/src/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# URL of the existing QuantaPhi AI route (GPT-routed Cloudflare worker)
QUANTAPHI_AI_URL = ""

[[d1_databases]]
binding = "DB"
database_name = "quant-ai"
database_id = "4bb698ec-ee8c-42ec-ab4b-329f5df6ef95"

# Existing authoritative QuantaPhi ledgers; IDs copied from
# QuantaPhi/workers/quanta-phi-ledger/wrangler.toml.
# These are resource identifiers, not credentials. Verify account access at deploy.
[[d1_databases]]
binding = "IDENTITY_DB"
database_name = "starquest-ledger"
database_id = "a1a973b2-a37c-4e1c-b68e-a73803238206"

[[d1_databases]]
binding = "QUANTA_DB"
database_name = "infinity-ledger"
database_id = "711b3e05-f318-4d30-9a67-4de2af92aa6d"

[[services]]
binding = "ORACLE"
service = "infinity-rogers"
